<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои привычки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e10;
  --surface: #18181c;
  --surface2: #222228;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --text: #f0f0f2;
  --muted: #8a8a96;
  --accent: #a8ff78;
  --accent2: #78d4ff;
  --accent3: #ffb347;
  --done-bg: rgba(168,255,120,0.08);
  --done-border: rgba(168,255,120,0.3);
  --font-head: 'Unbounded', sans-serif;
  --font-body: 'Golos Text', sans-serif;
  --r: 12px;
  --r-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  padding: 0;
}

/* ── layout ── */
.app { max-width: 700px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

/* ── header ── */
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 2rem;
}
.app-title {
  font-family: var(--font-head);
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: -0.02em;
}
.tab-bar {
  display: flex;
  gap: 4px;
  background: var(--surface);
  border-radius: 10px;
  padding: 4px;
  border: 0.5px solid var(--border);
}
.tab {
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 13px;
  font-family: var(--font-body);
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--muted);
  transition: all 0.18s;
}
.tab.active { background: var(--surface2); color: var(--text); }

/* ── date nav ── */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}
.date-label {
  font-family: var(--font-head);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.nav-btn {
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: var(--r-sm);
  padding: 7px 13px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  transition: all 0.15s;
}
.nav-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface2); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

/* ── week strip ── */
.week-strip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  margin-bottom: 1.5rem;
}
.wday {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.wday-label { font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
.wday-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  transition: all 0.18s;
}
.wday-dot.partial { border-color: rgba(168,255,120,0.3); color: var(--accent); }
.wday-dot.full { background: var(--accent); border-color: var(--accent); color: #0e0e10; }
.wday-dot.cur { box-shadow: 0 0 0 2px var(--text); }
.wday:hover .wday-dot { border-color: var(--border2); background: var(--surface2); }

/* ── progress ── */
.progress-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}
.progress-row span:last-child { color: var(--accent); font-weight: 600; }
.progress-track {
  height: 4px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.4s cubic-bezier(.4,0,.2,1);
}

/* ── stats ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 1.75rem;
}
.stat-box {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--r);
  padding: 12px 14px;
}
.stat-num {
  font-family: var(--font-head);
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1;
  margin-bottom: 4px;
}
.stat-lbl { font-size: 11px; color: var(--muted); }

/* ── sections ── */
.section { margin-bottom: 1.25rem; }
.section-head {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-left: 2px;
}
.habit {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 5px;
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
}
.habit:hover { border-color: var(--border2); }
.habit.done {
  background: var(--done-bg);
  border-color: var(--done-border);
}
.habit-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.18s;
  font-size: 12px;
}
.habit.done .habit-check {
  background: var(--accent);
  border-color: var(--accent);
  color: #0e0e10;
}
.habit-icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.habit-name { font-size: 14px; flex: 1; line-height: 1.4; }
.habit.done .habit-name { color: var(--accent); }
.badge-week {
  font-size: 10px;
  color: var(--accent3);
  background: rgba(255,179,71,0.1);
  border-radius: 20px;
  padding: 2px 8px;
  flex-shrink: 0;
}

/* ── motivation ── */
.motivation {
  margin-top: 1.25rem;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  padding: 12px;
  background: var(--surface);
  border-radius: var(--r);
  border: 0.5px solid var(--border);
  line-height: 1.6;
}

/* ── MONTH VIEW ── */
#view-month { display: none; }
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}
.month-label {
  font-family: var(--font-head);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.month-grid-head {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 6px;
}
.month-grid-head span {
  text-align: center;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 1.5rem;
}
.mcell {
  aspect-ratio: 1;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  gap: 2px;
}
.mcell.empty { border: none; cursor: default; }
.mcell.today-cell { border-color: var(--accent); color: var(--text); }
.mcell.partial { background: rgba(168,255,120,0.07); border-color: rgba(168,255,120,0.2); color: var(--accent); }
.mcell.full { background: var(--accent); border-color: var(--accent); color: #0e0e10; }
.mcell .day-num { font-size: 12px; font-weight: 600; line-height: 1; }
.mcell .day-pct { font-size: 9px; opacity: 0.75; line-height: 1; }
.mcell:not(.empty):hover { border-color: var(--border2); }
.month-legend {
  display: flex;
  gap: 16px;
  justify-content: center;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 1.5rem;
}
.legend-dot {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  display: inline-block;
  vertical-align: middle;
  margin-right: 5px;
}

/* month detail */
.month-detail {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--r);
  padding: 1rem 1.25rem;
}
.month-detail-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 10px;
}
.month-detail-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 0.5px solid var(--border);
  font-size: 13px;
}
.month-detail-row:last-child { border-bottom: none; }
.mdr-check { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.mdr-check.done { background: var(--accent); border-color: var(--accent); color: #0e0e10; }
.mdr-name { flex: 1; color: var(--muted); }
.mdr-name.done { color: var(--text); }

/* scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="top-header">
    <div class="app-title">привычки</div>
    <div class="tab-bar">
      <button class="tab active" onclick="switchTab('day')">День</button>
      <button class="tab" onclick="switchTab('month')">Месяц</button>
    </div>
  </div>

  <!-- DAY VIEW -->
  <div id="view-day">
    <div class="date-nav">
      <button class="nav-btn" onclick="changeDay(-1)">←</button>
      <div class="date-label" id="date-label"></div>
      <button class="nav-btn" id="next-btn" onclick="changeDay(1)">→</button>
    </div>

    <div class="week-strip" id="week-strip"></div>

    <div class="progress-row">
      <span>прогресс дня</span>
      <span id="prog-text">0 / 0</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="prog-bar" style="width:0%"></div></div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num" id="s-done" style="color:var(--accent)">0</div>
        <div class="stat-lbl">выполнено сегодня</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="s-streak" style="color:var(--accent2)">0</div>
        <div class="stat-lbl">дней подряд 🔥</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="s-week" style="color:var(--accent3)">0%</div>
        <div class="stat-lbl">за 7 дней</div>
      </div>
    </div>

    <div id="sections-container"></div>
    <div class="motivation" id="motivation"></div>
  </div>

  <!-- MONTH VIEW -->
  <div id="view-month">
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">←</button>
      <div class="month-label" id="month-label"></div>
      <button class="nav-btn" onclick="changeMonth(1)">→</button>
    </div>
    <div class="month-grid-head">
      <span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span>
    </div>
    <div class="month-grid" id="month-grid"></div>
    <div class="month-legend">
      <span><span class="legend-dot" style="background:var(--accent)"></span>все выполнено</span>
      <span><span class="legend-dot" style="background:rgba(168,255,120,0.2);border:1px solid rgba(168,255,120,0.4)"></span>частично</span>
      <span><span class="legend-dot" style="background:var(--surface2)"></span>не отмечено</span>
    </div>
    <div class="month-detail" id="month-detail" style="display:none">
      <div class="month-detail-title" id="mdt-title"></div>
      <div id="mdt-rows"></div>
    </div>
  </div>
</div>

<script>
const HABITS = [
  // ── Утро
  { id:'water_lemon',  section:'🌅 Утро',        name:'Стакан тёплой воды с лимоном натощак',        icon:'🍋' },
  { id:'warmup',       section:'🌅 Утро',        name:'Разминка 10 мин (суставы + растяжка)',         icon:'🤸' },
  { id:'no_sugar_am',  section:'🌅 Утро',        name:'Завтрак без сахара и сдобы',                   icon:'🥣' },

  // ── Тренировка
  { id:'pushups',      section:'💪 Тренировка',  name:'Отжимания — 5 × 10',                          icon:'💪' },
  { id:'pullups',      section:'💪 Тренировка',  name:'Подтягивания с прыжком — 5 × 5',              icon:'🏗️' },
  { id:'abs',          section:'💪 Тренировка',  name:'Пресс на турнике (подъём ног) — 5 × 5',       icon:'⬆️' },
  { id:'cardio',       section:'💪 Тренировка',  name:'Кардио: ходьба / бег 30+ мин',                icon:'🏃' },

  // ── Питание (ключ к холестерину)
  { id:'fiber',        section:'🥗 Питание',     name:'Клетчатка: овощи / бобы / овсянка',           icon:'🥦' },
  { id:'olive_oil',    section:'🥗 Питание',     name:'Оливковое масло вместо сливочного',            icon:'🫒' },
  { id:'nuts',         section:'🥗 Питание',     name:'Горсть орехов (грецкие / миндаль)',            icon:'🥜' },
  { id:'no_fry',       section:'🥗 Питание',     name:'Без жарки — запечённое или варёное',           icon:'♨️' },
  { id:'no_sweet',     section:'🥗 Питание',     name:'Без печенья, выпечки и фастфуда',              icon:'🚫' },
  { id:'no_late',      section:'🥗 Питание',     name:'Не есть после 20:00',                         icon:'🌙' },
  { id:'fish',         section:'🥗 Питание',     name:'Жирная рыба (лосось / скумбрия / сельдь)',    icon:'🐟', weekly:true },

  // ── День
  { id:'water_day',    section:'💧 Вода и день', name:'2 стакана воды в течение дня',                icon:'💧' },
  { id:'walk',         section:'💧 Вода и день', name:'Прогулка на улице 60 мин',                    icon:'🚶' },
  { id:'no_stress',    section:'💧 Вода и день', name:'5 мин спокойного дыхания / медитация',        icon:'🧘' },

  // ── Вечер
  { id:'book',         section:'🌙 Вечер',       name:'Чтение книги 30 мин',                         icon:'📖' },
  { id:'sleep',        section:'🌙 Вечер',       name:'Экран выключен в 22:30 — сон в 23:00',        icon:'🌛' },
];

const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_RU_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DAYS_RU = ['вс','пн','вт','ср','чт','пт','сб'];
const MOTIV_FULL = ['Идеальный день! Ты — машина 💪','Всё выполнено. Ты чемпион своего дня.','100% — так держать, серьёзно.'];
const MOTIV_HALF = ['Больше половины — уже победа.','Хороший темп! Закрой оставшееся.','Почти! Ещё чуть-чуть 👊'];
const MOTIV_START = ['Новый день — новый шанс. Поехали!','Первый шаг — самый важный. Сделай его.','Сегодня — хороший день стать лучше.'];

let state = {};
const todayZero = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
let curDay = todayZero();
let curMonthDate = new Date(todayZero().getFullYear(), todayZero().getMonth(), 1);
let activeTab = 'day';

function dateKey(d){ return d.toISOString().slice(0,10); }

function load(){ try{ state=JSON.parse(localStorage.getItem('habits_v2')||'{}'); }catch(e){ state={}; } }
function save(){ localStorage.setItem('habits_v2',JSON.stringify(state)); }
function dayData(d){ const k=dateKey(d); if(!state[k])state[k]={}; return state[k]; }

function toggleHabit(id){
  const d=dayData(curDay);
  d[id]=!d[id];
  save(); renderDay();
}

function changeDay(delta){
  const nd=new Date(curDay); nd.setDate(nd.getDate()+delta);
  if(nd<=todayZero()){ curDay=nd; renderDay(); }
}

function changeMonth(delta){
  curMonthDate.setMonth(curMonthDate.getMonth()+delta);
  renderMonth();
}

function switchTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('view-day').style.display = tab==='day'?'block':'none';
  document.getElementById('view-month').style.display = tab==='month'?'block':'none';
  if(tab==='month') renderMonth();
}

function getStreak(){
  let streak=0, d=new Date(todayZero());
  const total=HABITS.filter(h=>!h.weekly).length;
  for(let i=0;i<365;i++){
    const dd=state[dateKey(d)]||{};
    const done=HABITS.filter(h=>!h.weekly).filter(h=>dd[h.id]).length;
    if(done>=Math.floor(total*0.8)){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function getWeekPct(){
  let tot=0,done=0;
  for(let i=0;i<7;i++){
    const d=new Date(todayZero()); d.setDate(d.getDate()-i);
    const dd=state[dateKey(d)]||{};
    const h=HABITS.filter(x=>!x.weekly);
    tot+=h.length; done+=h.filter(x=>dd[x.id]).length;
  }
  return tot>0?Math.round(done/tot*100):0;
}

function dayPct(d){
  const dd=state[dateKey(d)]||{};
  const h=HABITS.length;
  const done=HABITS.filter(x=>dd[x.id]).length;
  return h>0?Math.round(done/h*100):0;
}

function formatDate(d){
  const today=todayZero();
  const label=dateKey(d)===dateKey(today)?'сегодня':DAYS_RU[d.getDay()];
  return `${label}, ${d.getDate()} ${MONTHS_RU_GEN[d.getMonth()]}`;
}

function renderDay(){
  const today=todayZero();
  const isToday=dateKey(curDay)===dateKey(today);
  document.getElementById('date-label').textContent=formatDate(curDay);
  const nb=document.getElementById('next-btn');
  nb.disabled=isToday;

  // week strip
  const ws=document.getElementById('week-strip');
  ws.innerHTML='';
  for(let i=6;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const pct=dayPct(d);
    const isCur=dateKey(d)===dateKey(curDay);
    const jsDay=d.getDay();
    const lbl=['вс','пн','вт','ср','чт','пт','сб'][jsDay];
    const dotCls=(pct===100?'full':pct>0?'partial':'')+(isCur?' cur':'');
    const delta=-i;
    const el=document.createElement('div');
    el.className='wday';
    el.onclick=()=>{ const nd=new Date(today); nd.setDate(nd.getDate()+delta); curDay=nd; renderDay(); };
    el.innerHTML=`<span class="wday-label">${lbl}</span><div class="wday-dot ${dotCls}">${pct>0&&pct<100?pct+'%':pct===100?'✓':''}</div>`;
    ws.appendChild(el);
  }

  const dd=dayData(curDay);
  const total=HABITS.length;
  const done=HABITS.filter(h=>dd[h.id]).length;
  const pct=total>0?Math.round(done/total*100):0;

  document.getElementById('prog-text').textContent=`${done} / ${total}`;
  document.getElementById('prog-bar').style.width=pct+'%';
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-streak').textContent=getStreak();
  document.getElementById('s-week').textContent=getWeekPct()+'%';

  // sections
  const sections={};
  HABITS.forEach(h=>{ if(!sections[h.section])sections[h.section]=[]; sections[h.section].push(h); });
  const container=document.getElementById('sections-container');
  container.innerHTML='';
  Object.entries(sections).forEach(([sec,habits])=>{
    const secDiv=document.createElement('div');
    secDiv.className='section';
    secDiv.innerHTML=`<div class="section-head">${sec}</div>`;
    habits.forEach(h=>{
      const isDone=!!dd[h.id];
      const el=document.createElement('div');
      el.className='habit'+(isDone?' done':'');
      el.onclick=()=>toggleHabit(h.id);
      el.innerHTML=`
        <div class="habit-check">${isDone?'✓':''}</div>
        <span class="habit-icon">${h.icon}</span>
        <span class="habit-name">${h.name}</span>
        ${h.weekly?'<span class="badge-week">раз в неделю</span>':''}
      `;
      secDiv.appendChild(el);
    });
    container.appendChild(secDiv);
  });

  const msgs=pct===100?MOTIV_FULL:pct>=50?MOTIV_HALF:MOTIV_START;
  document.getElementById('motivation').textContent=msgs[Math.floor(Math.random()*msgs.length)];
}

function renderMonth(){
  const yr=curMonthDate.getFullYear();
  const mo=curMonthDate.getMonth();
  document.getElementById('month-label').textContent=`${MONTHS_RU[mo]} ${yr}`;
  const today=todayZero();

  const grid=document.getElementById('month-grid');
  grid.innerHTML='';

  const firstDay=new Date(yr,mo,1);
  let startDow=firstDay.getDay(); // 0=Sun
  startDow=startDow===0?6:startDow-1; // Mon=0

  const daysInMonth=new Date(yr,mo+1,0).getDate();

  for(let i=0;i<startDow;i++){
    const el=document.createElement('div');
    el.className='mcell empty';
    grid.appendChild(el);
  }

  for(let day=1;day<=daysInMonth;day++){
    const d=new Date(yr,mo,day);
    const pct=dayPct(d);
    const isToday=dateKey(d)===dateKey(today);
    const isFuture=d>today;
    let cls='mcell';
    if(!isFuture){
      if(pct===100) cls+=' full';
      else if(pct>0) cls+=' partial';
    }
    if(isToday) cls+=' today-cell';

    const el=document.createElement('div');
    el.className=cls;
    el.innerHTML=`<span class="day-num">${day}</span>${!isFuture&&pct>0?`<span class="day-pct">${pct}%</span>`:''}`;
    if(!isFuture) el.onclick=()=>showDayDetail(d);
    grid.appendChild(el);
  }

  document.getElementById('month-detail').style.display='none';
}

function showDayDetail(d){
  const dd=state[dateKey(d)]||{};
  const title=`${d.getDate()} ${MONTHS_RU_GEN[d.getMonth()]}`;
  document.getElementById('mdt-title').textContent=title;
  const rows=document.getElementById('mdt-rows');
  rows.innerHTML='';
  HABITS.forEach(h=>{
    const done=!!dd[h.id];
    const row=document.createElement('div');
    row.className='month-detail-row';
    row.innerHTML=`
      <div class="mdr-check ${done?'done':''}">${done?'✓':''}</div>
      <span class="mdr-name ${done?'done':''}">${h.icon} ${h.name}</span>
    `;
    rows.appendChild(row);
  });
  document.getElementById('month-detail').style.display='block';
}

load();
renderDay();
</script>
